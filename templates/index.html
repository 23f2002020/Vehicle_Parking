<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12b886">
  <meta name="description" content="VParkEasy - find, book and pay for a parking slot in seconds. Live slot maps, EV charging, car wash and a fair 45-minute turnaround gap between bookings.">
  <title>VParkEasy</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">

  <!-- Fonts: optional. If Google Fonts is unreachable the system font stack takes over. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Everything else is vendored under /static/vendor, so the app works offline / behind a firewall -
       EXCEPT the Leaflet map's own tile images, which are the one deliberate exception: real pickup/
       drop-off location picking and captain navigation need a real map, so the map TILES load live from
       the public OpenStreetMap tile server at runtime (see FIXES.md). The Leaflet library itself, its
       CSS and its marker icons are vendored below exactly like everything else - only the tile pictures
       need the network, and the map still degrades gracefully (grey squares, everything else keeps
       working) if that one request can't reach the internet. -->
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/landing.css">
  <link rel="stylesheet" href="/static/css/user.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <link rel="stylesheet" href="/static/css/partner.css">
</head>
<body>
  <div id="app"><div class="boot">Loading VParkEasy&hellip;</div></div>
  <noscript><p style="padding:40px;text-align:center">VParkEasy needs JavaScript. Please enable it and reload.</p></noscript>

  <script src="/static/vendor/vue.min.js"></script>
  <script src="/static/vendor/vue-router.min.js"></script>
  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
